# SPDX-License-Identifier: MIT
# Requires Compose >=2.24.4 for !override. Layer on docker-compose.dev.yml.
services:
  core:
    ports: !override
      - 127.0.0.1:3000:3000
    # Replace the base environment to exclude FXP_SYMBOLS even if the caller
    # has an allow-list in its shell; scenarios need fresh unlisted books.
    environment: !override
      FXP_SYMBOL_CONFIG: /etc/fxp/config/symbols.demo.csv
      FXP_MAX_SYMBOLS: "4096"
      FXP_HOP_TRACE: ${FXP_CORE_HOP_TRACE:-}
      RUST_LOG: ${RUST_LOG:-info}
      FXP_SESSION_SCHEDULE:
      FXP_EVENT_LOG:
      FXP_STP_DEFAULT:
      FXP_SHUTDOWN_TIMEOUT_SEC: ${FXP_SHUTDOWN_TIMEOUT_SEC:-5}
      FXP_CORE_AUTH_TOKEN: ''
  gateway:
    environment:
      FXP_GW_TCP_ADDR: 127.0.0.1:8082
      FXP_GW_WS_ADDR: 127.0.0.1:8081
      FXP_SYMBOL_CONFIG: /etc/fxp/config/symbols.demo.csv
  bridge:
    # FIX is not part of this local browser demo. Enable explicitly if needed.
    profiles: !override [fix]
  demo_api:
    image: fxp-demo:local
    build:
      context: .
      dockerfile: Dockerfile.demo
    init: true
    network_mode: service:core
    depends_on:
      core:
        condition: service_healthy
      gateway:
        condition: service_started
    profiles: [demo]
    stop_grace_period: 10s
    environment:
      FXP_DEMO_ADDR: 0.0.0.0:3000
      FXP_DEMO_ORIGIN: http://127.0.0.1:3000
      FXP_ALLOW_PLAINTEXT: 'true'
      FXP_DEMO_GATEWAY_WS_URL: ws://127.0.0.1:8081/ws
      FXP_SIM_GATEWAY_ADDR: 127.0.0.1:8082
      FXP_JWT_SECRET: ${FXP_JWT_SECRET:?set FXP_JWT_SECRET}
      FXP_JWT_ISSUER: ${FXP_JWT_ISSUER:-fxp-dev}
      FXP_JWT_AUDIENCE: ${FXP_JWT_AUDIENCE:-fxp-gateway}
      FXP_JWT_KID: ${FXP_JWT_KID:-}
      FXP_DEMO_TOKEN_TTL_SEC: ${FXP_DEMO_TOKEN_TTL_SEC:-900}
      FXP_DEMO_TOKEN_RATE_PER_MIN: ${FXP_DEMO_TOKEN_RATE_PER_MIN:-10}
      FXP_SYMBOL_CONFIG: /etc/fxp/config/symbols.demo.csv
    volumes:
      - ./config:/etc/fxp/config:ro
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/healthz]
      interval: 2s
      timeout: 2s
      retries: 20
