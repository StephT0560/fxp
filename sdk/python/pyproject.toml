[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxp-client"
version = "0.1.0"
description = "Minimal synchronous FXP gateway TCP client for local bot development"
requires-python = ">=3.10"
dependencies = ["protobuf>=4.25,<8"]

[tool.setuptools.packages.find]
include = ["fxp_client*"]
