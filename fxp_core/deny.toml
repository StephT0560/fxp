# SPDX-License-Identifier: MIT
# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
confidence-threshold = 0.8
# prost-build 0.14 -> petgraph -> hashbrown -> foldhash. Keep the
# permissive Zlib exception scoped to the actual reviewed dependency.
exceptions = [{ name = "foldhash", version = "0.1.5", allow = ["Zlib"] }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
