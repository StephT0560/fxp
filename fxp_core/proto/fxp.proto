syntax = "proto3";

package fxp;

option go_package = "go_gateway/protobuf";

import "google/protobuf/timestamp.proto";

// ============================================================
// FXP Protocol — v2.5 adds public trade-feed fields.
// v2.3 added order-status requests/replies.
// v2.2 added self-trade prevention, cancel-on-disconnect and mass cancel.
// v2.1 added auction/session messages.
// Version 2.0 shifts all enum numbers and is wire-breaking with v1.x.
//
// Design principles:
//   - Field numbers are permanent wire identifiers. Never reuse
//     a retired field number — doing so causes silent data corruption
//     for clients that haven't upgraded.
//   - Add new fields at the end of each message (higher numbers).
//   - Add new enum values at the end of each enum.
//   - Firms requiring custom fields should use field numbers
//     1000–1999 (reserved for vendor/firm extensions).
//   - Proto3 defaults are zero/empty — never use zero to mean
//     "no value" for a field where zero is a valid state.
// ============================================================

// ============================================================
// META & VERSIONING
// ============================================================

message FXPHeader {
  string protocol_version = 1; // e.g. "2.1"
  uint64 sequence_number  = 2; // monotonically increasing per session
}

// ============================================================
// SESSION MANAGEMENT
// ============================================================

message Heartbeat {
  string                    status    = 1;
  google.protobuf.Timestamp timestamp = 2;
}

// Logon: JWT-only authentication.
// Token must be HS256-signed with the shared session secret.
// Required claims: sub (trader ID), exp (expiry), iat (issued at).
message Logon {
  string                    token           = 1; // HS256-signed JWT
  string                    session_id      = 2;
  EncryptionType            encryption_type = 3;
  google.protobuf.Timestamp timestamp       = 4;
  // v2.2: cancel every live order of this owner (including parked stops)
  // when the session ends for any reason. Default off.
  bool                      cancel_on_disconnect = 5;
}

// LogonAck: sent by gateway after validating the Logon token.
message LogonAck {
  FXPHeader                 header        = 1;
  bool                      accepted      = 2; // true = session open
  string                    reject_reason = 3; // set only when accepted = false
  google.protobuf.Timestamp timestamp     = 4;
}

message Logout {
  string                    session_id = 1;
  google.protobuf.Timestamp timestamp  = 2;
}

message GapFillRequest {
  uint64 start_sequence = 1;
  uint64 end_sequence   = 2;
}

enum EncryptionType {
  ENCRYPTION_TYPE_UNSPECIFIED = 0;
  NONE                       = 1;
  TLS_1_2                    = 2;
  TLS_1_3                    = 3;
}

// ============================================================
// ORDER ENUMERATIONS
// ============================================================

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  MARKET                 = 1;
  LIMIT                  = 2;
  STOP                   = 3; // triggers market order when stop_price is reached
  STOP_LIMIT             = 4; // triggers limit order when stop_price is reached
  // Firms may define proprietary types (pegged, VWAP, TWAP) using
  // values 100+ via the custom extension pattern.
}

enum OrderSide {
  ORDER_SIDE_UNSPECIFIED = 0;
  BUY                    = 1;
  SELL                   = 2;
  // SHORT_SELL is a regulatory distinction (Reg SHO) handled at the
  // OMS layer, not the matching layer. Firms needing it can use
  // custom field 1000 on NewOrderSingle for a short-sale indicator.
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0; // no change
  DAY                       = 1; // expires at end of regular trading session
  GTC                       = 2; // Good Till Cancelled — persists across sessions
  IOC                       = 3; // Immediate or Cancel — fill available, cancel rest
  FOK                       = 4; // Fill or Kill — fill all immediately or cancel all
  AT_OPEN                   = 5; // participate in opening auction only
  AT_CLOSE                  = 6; // participate in closing auction only (e.g. MOC)
  GTD                       = 7; // Good Till Date — expires at end of expire_date
  // AT_OPEN and AT_CLOSE require auction session support in the
  // matching engine (opening/closing auction phases).
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_NEW                = 1; // accepted, working
  ORDER_PENDING            = 2; // received, pending validation
  ORDER_FILLED             = 3; // completely filled
  ORDER_PARTIALLY_FILLED   = 4; // partially filled, remainder working
  ORDER_CANCELED           = 5; // canceled
  ORDER_REJECTED           = 6; // rejected at validation
  ORDER_REPLACED           = 7; // successfully replaced via cancel/replace
  ORDER_EXPIRED            = 8; // expired (DAY at session end, GTD past date)
  ORDER_PENDING_CANCEL     = 9; // cancel request received, not yet processed
  ORDER_PENDING_REPLACE    = 10; // replace request received, not yet processed
}

enum ExecutionType {
  EXECUTION_TYPE_UNSPECIFIED = 0;
  EXEC_NEW                   = 1; // order accepted — sent on NewOrderSingle ack
  EXEC_FILLED                = 2; // full or partial fill (distinguish via order_status)
  EXEC_CANCELED              = 3; // order canceled
  EXEC_REPLACED              = 4; // order replaced (cancel/replace accepted)
  EXEC_REJECTED              = 5; // order or cancel/replace rejected
  EXEC_EXPIRED               = 6; // order expired at session end or GTD date
  EXEC_PENDING_CANCEL        = 7; // cancel pending confirmation
  EXEC_PENDING_REPLACE       = 8; // replace pending confirmation
  EXEC_RESTATED              = 9; // v2.2: quantity reduced by self-trade prevention
  EXEC_ORDER_STATUS          = 10; // v2.3: snapshot, not a lifecycle event
}

// Self-trade prevention instruction (v2.2). The aggressing (newest) order's
// instruction governs a match against a resting order with the same STP key
// (stp_group if set, otherwise the owner).
enum SelfTradePrevention {
  SELF_TRADE_PREVENTION_UNSPECIFIED          = 0; // use the engine default (FXP_STP_DEFAULT)
  SELF_TRADE_PREVENTION_NONE                 = 1; // explicitly disabled for this order
  SELF_TRADE_PREVENTION_CANCEL_NEWEST        = 2; // cancel the aggressor's remaining quantity
  SELF_TRADE_PREVENTION_CANCEL_OLDEST        = 3; // cancel the resting order, keep matching
  SELF_TRADE_PREVENTION_CANCEL_BOTH          = 4; // cancel both orders
  SELF_TRADE_PREVENTION_DECREMENT_AND_CANCEL = 5; // reduce both by the smaller qty; cancel the smaller
}

enum MassCancelReason {
  MASS_CANCEL_REASON_UNSPECIFIED = 0;
  MASS_CANCEL_REASON_REQUEST            = 1; // explicit OrderMassCancelRequest
  MASS_CANCEL_REASON_DISCONNECT         = 2; // cancel-on-disconnect
}

enum TradingPhase {
  TRADING_PHASE_UNSPECIFIED = 0;
  CLOSED                   = 1;
  OPENING_CALL             = 2;
  CONTINUOUS               = 3;
  CLOSING_CALL             = 4;
}

// ============================================================
// ORDER MESSAGES
// ============================================================

message NewOrderSingle {
  FXPHeader                 header          = 1;
  string                    order_id        = 2;  // client-assigned, unique per session
  string                    sender          = 3;  // SenderCompID
  string                    receiver        = 4;  // TargetCompID
  string                    symbol          = 5;
  int64                     price           = 6;  // int64 minor units; per-symbol price_scale (default 2)
  OrderSide                 side            = 7;
  int32                     quantity        = 8;
  OrderType                 order_type      = 9;
  TimeInForce               time_in_force   = 10;
  google.protobuf.Timestamp timestamp       = 11;
  int64                     stop_price      = 12; // required for STOP / STOP_LIMIT
  string                    expire_date     = 13; // required for GTD (format: YYYY-MM-DD)
  string                    account         = 14; // clearing account identifier
  string                    client_order_id = 15; // optional secondary client reference
  SelfTradePrevention       stp_mode        = 16; // v2.2
  string                    stp_group       = 17; // v2.2: optional; namespaced per owner by the gateway
  int32                     display_quantity = 18; // v2.4: 0 fully displayed, positive = MaxFloor

  // Field numbers 1000–1999 reserved for firm-specific extensions.
  // Example: int32 short_sale_indicator = 1000;
  // Example: string algo_id = 1001;
}

// OrderCancelRequest: request to cancel a working order.
// Routed to the symbol's order book task for processing.
// Response: ExecutionReport with exec_type = EXEC_CANCELED (success)
//           or exec_type = EXEC_REJECTED (order not found / already filled).
message OrderCancelRequest {
  FXPHeader                 header           = 1;
  string                    order_id         = 2; // order to cancel
  string                    client_cancel_id = 3; // unique ID for this cancel request
  string                    sender           = 4;
  string                    receiver         = 5;
  string                    symbol           = 6;
  google.protobuf.Timestamp timestamp        = 7;
}

// OrderCancelReplaceRequest: atomically cancel and replace a working order.
// Used to amend price or quantity. Queue priority rules:
//   - Price change: always loses time priority
//   - Quantity reduction: retains priority at most exchanges
//   - Quantity increase: loses priority (treated as new order)
// Response: ExecutionReport with exec_type = EXEC_REPLACED (success)
//           or exec_type = EXEC_REJECTED (too late, not found, invalid).
message OrderCancelReplaceRequest {
  FXPHeader                 header            = 1;
  string                    order_id          = 2; // original order being replaced
  string                    new_order_id      = 3; // new client order ID after replace
  string                    client_replace_id = 4; // unique ID for this replace request
  string                    sender            = 5;
  string                    receiver          = 6;
  string                    symbol            = 7;
  int64                     new_price         = 8; // 0 = no change
  int32                     new_quantity      = 9; // 0 = no change
  TimeInForce               new_time_in_force = 10; // TIME_IN_FORCE_UNSPECIFIED (0) = no change
  google.protobuf.Timestamp timestamp         = 11;
  int64                     new_stop_price    = 12; // 0 = no change (Stop / StopLimit only)
  optional int32            new_display_quantity = 13; // v2.4: absent keep, 0 fully displayed
}

// OrderAcknowledgment: legacy. Prefer ExecutionReport with exec_type=EXEC_NEW.
// Retained for backward compatibility with older clients.
message OrderAcknowledgment {
  FXPHeader                 header                = 1;
  string                    order_id              = 2;
  string                    acknowledgment_status = 3;
  google.protobuf.Timestamp timestamp             = 4;
}

// ExecutionReport: the primary order lifecycle message.
// Sent on every order state transition: NEW, FILL, PARTIAL FILL,
// CANCEL, REPLACE, REJECT, EXPIRE.
//
// Reconciliation fields (leaves_quantity, avg_px, cum_quantity) are
// essential for institutional order tracking and must be populated
// on every report where they are meaningful.
message ExecutionReport {
  FXPHeader                 header            = 1;
  string                    execution_id      = 2;  // unique per fill event
  string                    order_id          = 3;  // client order ID
  string                    symbol            = 4;
  ExecutionType             execution_type    = 5;
  OrderStatus               order_status      = 6;
  int64                     execution_price   = 7;  // price of this fill (0 on non-fill events)
  int32                     executed_quantity = 8;  // qty filled in this event
  google.protobuf.Timestamp timestamp         = 9;

  // Reconciliation fields — populate on every report
  int32                     leaves_quantity   = 10; // qty still open after this report
  int64                     avg_px            = 11; // VWAP across all fills for this order
  int32                     cum_quantity      = 12; // total qty filled across all reports

  // Audit / routing fields
  string                    account           = 13; // clearing account (echoed from NewOrder)
  string                    client_order_id   = 14; // echoed from NewOrderSingle if set
  string                    orig_order_id     = 15; // original order_id (on REPLACED reports)
  string                    reject_reason     = 16; // human-readable reason (EXEC_REJECTED; STP / mass cancels)
  OrderSide                 side              = 17; // side of the order
  int32                     order_quantity    = 18; // total order quantity (FIX OrderQty)
  bool                      auction           = 19;
  int32                     display_quantity  = 20; // v2.4: configured MaxFloor, 0 fully displayed

  // Field numbers 1000–1999 reserved for firm-specific extensions.
}

// OrderMassCancelRequest (v2.2): cancel every live order of `sender`
// (including parked stops), optionally filtered by symbol and side. The
// gateway overwrites `sender` with the authenticated owner.
message OrderMassCancelRequest {
  FXPHeader                 header            = 1;
  string                    sender            = 2;
  string                    symbol            = 3; // empty = all symbols
  OrderSide                 side              = 4; // UNSPECIFIED = both sides
  string                    client_request_id = 5;
  MassCancelReason          reason            = 6;
  google.protobuf.Timestamp timestamp         = 7;
}

// OrderMassCancelReport (v2.2): sent after the individual EXEC_CANCELED reports.
message OrderMassCancelReport {
  FXPHeader                 header            = 1;
  string                    client_request_id = 2;
  string                    symbol            = 3;
  OrderSide                 side              = 4;
  uint32                    total_affected    = 5;
  MassCancelReason          reason            = 6;
  string                    reject_reason     = 7; // non-empty when rejected
  google.protobuf.Timestamp timestamp         = 8;
  string                    sender            = 9; // owner the request was scoped to
}

// ============================================================
// MARKET DATA MESSAGES
// ============================================================

message MarketOrderBookEntry {
  int64     price = 1;
  int32     size  = 2;
  OrderSide side  = 3;
}

message MarketOrderUpdate {
  int32     update_type = 1; // 0 = NewOrder, 1 = ModifyOrder, 2 = CancelOrder
  int64     price       = 2;
  int32     quantity    = 3;
  OrderSide side        = 4; // book side of the level (BUY = bid, SELL = offer)
}

message MarketDataSnapshot {
  FXPHeader                     header         = 1;
  string                        symbol         = 2;
  repeated MarketOrderBookEntry bid_levels     = 3;
  repeated MarketOrderBookEntry ask_levels     = 4;
  int64                         bid_ask_spread = 5;
  int64                         total_volume   = 6;
  google.protobuf.Timestamp     timestamp      = 7;
}

message MarketDataIncrementalUpdate {
  FXPHeader                  header    = 1;
  string                     symbol    = 2;
  repeated MarketOrderUpdate changes   = 3;
  google.protobuf.Timestamp  timestamp = 4;
}

message MarketDataRequest {
  FXPHeader       header  = 1;
  repeated string symbols = 2;
}

message TradeCaptureReport {
  FXPHeader                 header         = 1;
  string                    trade_id       = 2;
  string                    buy_order_id   = 3; // Empty on the public trade feed.
  string                    sell_order_id  = 4; // Empty on the public trade feed.
  string                    symbol         = 5;
  int64                     trade_price    = 6;
  int32                     trade_quantity = 7;
  google.protobuf.Timestamp timestamp      = 8;
  OrderSide                 aggressor_side = 9;  // UNSPECIFIED for auction prints.
  uint64                    seq            = 10; // Per symbol; starts at 1 and is gap-free at the emitter.
  bool                      is_auction     = 11;
}

message TradingSessionStatus {
  string                    symbol    = 1;
  TradingPhase              phase     = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message AuctionInfo {
  string                    symbol             = 1;
  TradingPhase              phase              = 2;
  int64                     indicative_price   = 3;
  uint64                    indicative_volume  = 4;
  uint64                    imbalance_quantity = 5; // unsigned magnitude
  OrderSide                 imbalance_side     = 6; // UNSPECIFIED when balanced
  int64                     reference_price    = 7;
  google.protobuf.Timestamp timestamp          = 8;
}

// ============================================================
// ERROR HANDLING
// ============================================================

enum ErrorType {
  ERROR_TYPE_UNSPECIFIED = 0;
  SYSTEM_ERROR           = 1;
  INVALID_ORDER          = 2;
  SESSION_EXPIRED        = 3;
  RATE_LIMIT_EXCEEDED    = 4;
  ORDER_NOT_FOUND        = 5;
  SYMBOL_NOT_SUPPORTED   = 6;
  AUTH_FAILED            = 7;
  SESSION_NOT_LOGGED_ON  = 8;
  DUPLICATE_ORDER_ID     = 9; // order_id reused within the session
  INVALID_PRICE          = 10; // outside tick size or price band
  INVALID_QUANTITY       = 11; // zero, or exceeds position/lot-size limits
}

message ErrorMessage {
  FXPHeader                 header           = 1;
  ErrorType                 error_type       = 2;
  string                    error_message    = 3;
  string                    related_order_id = 4;
  google.protobuf.Timestamp timestamp        = 5;
}

// ============================================================
// TOP-LEVEL ENVELOPE
//
// oneof field numbers are permanent wire identifiers.
// Never reuse a retired number. Add new types at the end.
// ============================================================

message FXPMessage {
  oneof payload {
    Heartbeat                   heartbeat              = 1;
    Logon                       logon                  = 2;
    Logout                      logout                 = 3;
    GapFillRequest              gap_fill               = 4;
    NewOrderSingle              new_order              = 5;
    OrderAcknowledgment         order_acknowledgment   = 6;
    OrderCancelRequest          order_cancel           = 7;
    ExecutionReport             execution_report       = 8;
    MarketDataSnapshot          market_data_snapshot   = 9;
    MarketDataIncrementalUpdate market_data_incremental = 10;
    MarketDataRequest           market_data_request    = 11;
    TradeCaptureReport          trade_capture_report   = 12;
    ErrorMessage                error_message          = 13;
    LogonAck                    logon_ack              = 14;
    OrderCancelReplaceRequest   order_cancel_replace   = 15;
    TradingSessionStatus        trading_session_status = 16;
    AuctionInfo                 auction_info           = 17;
    OrderMassCancelRequest      order_mass_cancel      = 18;
    OrderMassCancelReport       order_mass_cancel_report = 19;
    OrderStatusRequest          order_status_request   = 20;
    OrderStatusResponse         order_status_response  = 21;
    SessionControl              session_control        = 22;
    SessionControlReport        session_control_report = 23;
  }
}

// v2.3: owner-scoped single or mass status. An empty order_id requests all
// retained orders (optionally a symbol/side). The gateway overwrites sender.
message OrderStatusRequest {
  string request_id = 1;
  string sender = 2;
  string order_id = 3;
  string symbol = 4;
  OrderSide side = 5;
}
message OrderStatusResponse {
  string request_id = 1;
  string sender = 2;
  repeated ExecutionReport reports = 3;
  string reject_reason = 4; // same unknown result for missing/non-owned IDs
  bool complete = 5; // last batch; response batches carry at most 64 reports
  uint32 total_reports = 6;
}
// v2.5 (operator): every symbol enters an opening call now and uncrosses after
// opening_call_seconds. The gateway forwards it only for operator tokens.
message SessionControl {
  string request_id = 1;
  string sender = 2;
  uint32 opening_call_seconds = 3; // 1..=3600
}
message SessionControlReport {
  string request_id = 1;
  string sender = 2;
  uint32 symbols_affected = 3;
  string reject_reason = 4; // non-empty when rejected
}
