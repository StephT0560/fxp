[package]
name = "fxp_core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
sha2 = "0.10"
constant_time_eq = "0.4.2"
dhat = { version = "0.3.3", optional = true }
prost = "0.14"
prost-types = "0.14"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[build-dependencies]
prost-build = "0.14"

[lib]
name = "fxp_core"
path = "src/lib.rs"

[[bench]]
name = "encoding_benchmark"
harness = false

[[bench]]
name = "router_benchmark"
harness = false

[features]
dhat = ["dep:dhat"]

[[bench]]
name = "engine_benchmark"
harness = false
