[package]
name = "fxp_core"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.44", features = ["full"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
prost-build = "0.13"

[lib]
name = "fxp_core"
path = "src/lib.rs"

[[bench]]
name = "encoding_benchmark"
harness = false

