[package]
name = "fxp_core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
prost-build = "0.14"

[lib]
name = "fxp_core"
path = "src/lib.rs"

[[bench]]
name = "encoding_benchmark"
harness = false

[[bench]]
name = "router_benchmark"
harness = false
