# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fxp_core
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: fmt, test, clippy, bench build, audit
        working-directory: fxp_core
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          # Warnings are reported but not fatal until the lint cleanup lands.
          cargo clippy --all-targets --locked -- -D warnings
          cargo bench --no-run --locked
          cargo audit

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: fxp_core/Cargo.toml
          command: check

  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [go_gateway, fix_bridge]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/gen_proto.sh
      - name: gofmt
        run: test -z "$(gofmt -l ${{ matrix.module }})" || { gofmt -l ${{ matrix.module }}; exit 1; }
      - name: vet, test, staticcheck, govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  e2e:
    name: e2e
    needs: [rust, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fxp_core
      - uses: actions/setup-go@v7
        with:
          go-version-file: go_gateway/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: bash scripts/gen_proto.sh && bash scripts/e2e.sh
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e
      - name: Simulator with random JWT secret and custom claims
        run: bash scripts/simday_smoke.sh
      - name: TLS/mTLS listeners and authenticated core e2e
        run: bash scripts/e2e_tls.sh
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-tls
      - name: CI gate regression tests
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s tests/ci -v
          python3 -m unittest discover -s tests/compose -v
          python3 -m unittest discover -s tests/security -v
          python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Default secure Compose build and smoke
        run: bash scripts/compose_check.sh
      - name: Benchmark smoke and static-artifact verifier tests
        run: |
          python3 -m unittest discover -s tests/release -v
          bash scripts/bench.sh "$RUNNER_TEMP/benchmark-smoke" --smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-smoke
          path: |
            ${{ runner.temp }}/benchmark-smoke/*.json
            ${{ runner.temp }}/benchmark-smoke/*.md
            ${{ runner.temp }}/benchmark-smoke/*.log
            ${{ runner.temp }}/benchmark-smoke/*.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-tls-logs
          path: ${{ runner.temp }}/e2e-tls
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e

  quickfix-acceptance:
    name: quickfix-acceptance (${{ matrix.compat }})
    strategy:
      fail-fast: false
      matrix:
        compat: [default, quickfix]
    needs: [rust, go]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fxp_core
      - uses: actions/setup-go@v7
        with:
          go-version-file: go_gateway/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: python3 -m unittest discover -s tests/quickfix -v
      - run: bash scripts/gen_proto.sh
      - name: Test compiled fixture guards
        working-directory: fix_bridge
        run: go test -race -tags quickfix_fixture -count=1 ./...
      - run: python3 scripts/quickfix_acceptance.py --compat ${{ matrix.compat }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quickfix-acceptance-${{ matrix.compat }}
          path: |
            target/quickfix-acceptance/${{ matrix.compat }}/*.log
            target/quickfix-acceptance/${{ matrix.compat }}/results.json

  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          input: fxp_core/proto
          lint: true
          format: false
          push: false
          # Lint/breaking results go to the job log; commenting needs pull-requests: write.
          pr_comment: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: "${{ github.event.repository.clone_url }}#branch=${{ github.base_ref }},subdir=fxp_core/proto"

  demo-api:
    name: demo-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: demo_api/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fxp_core
      - run: bash scripts/gen_proto.sh
      - name: Format, vet, race, staticcheck, vulnerabilities
        working-directory: demo_api
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Real core, gateway and BFF integration
        run: bash scripts/demo_api_smoke.sh
      - name: Compose demo build, private ports and health
        run: |
          make demo
          curl --fail http://127.0.0.1:3000/healthz
          python3 scripts/demo_compose_check.py
      - name: Stop demo
        if: always()
        run: make demo-down

  # Keep this name stable: the main ruleset requires only ci-success.
  ci-success:
    name: ci-success
    needs: [rust, cargo-deny, go, e2e, quickfix-acceptance, proto, demo-api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every dependency to succeed
        env:
          # go is the combined matrix result; no leg may continue-on-error.
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS_JSON" | python3 scripts/ci_success.py
