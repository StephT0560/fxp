# SPDX-License-Identifier: MIT
name: FXP release
on:
  push:
    tags: ['v*.*.*']
  # Manual runs build reviewable artifacts only; never create a release.
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Install checksum-verified protoc
        run: |
          sh "$GITHUB_WORKSPACE/scripts/install-protoc.sh" "$RUNNER_TEMP/fxp-protoc"
          echo "$RUNNER_TEMP/fxp-protoc/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fxp_core
          key: release-${{ matrix.arch }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go_gateway/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.27.1
      - name: Build static binaries and CycloneDX inventories
        run: bash scripts/build_release.sh '${{ matrix.arch }}' "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.cdx.json
            ${{ runner.temp }}/release/syft-version.txt
  images:
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native architecture manifests by digest
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          prefix="${IMAGE_PREFIX,,}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/images" "$RUNNER_TEMP/digests"
          for component in fxp_core go_gateway simday fix_bridge fxp-replay; do
            docker buildx build --file deploy/Dockerfile.release --target "$component" \
              --platform "linux/$ARCH" --provenance=false --sbom=false \
              --build-arg "VERSION=$RELEASE_TAG" --build-arg "GIT_SHA=$SOURCE_SHA" \
              --output "type=image,name=$prefix/$component,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "$RUNNER_TEMP/images/$component.json" .
          done
          python3 scripts/release_manifest.py record --arch "$ARCH" \
            --metadata-dir "$RUNNER_TEMP/images" --output "$RUNNER_TEMP/digests/$ARCH.json"
      - uses: actions/upload-artifact@v7
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.json
          if-no-files-found: error

  publish-images:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digests-*
          path: digests
          merge-multiple: true
      - name: Publish and verify two-platform version/SHA indexes, record pins
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p assets
          python3 scripts/release_manifest.py publish --directory digests \
            --prefix "${IMAGE_PREFIX,,}" --tag "$RELEASE_TAG" --sha "$(git rev-parse HEAD)" \
            --notes assets/image-release-notes.md --lock assets/images.json
      - uses: actions/upload-artifact@v7
        with:
          name: image-release-notes
          path: assets/*
          if-no-files-found: error

  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-linux-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: image-release-notes
          path: assets
      - name: Checksums and draft release (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd assets
          # Hash the archives and both source/binary SBOMs for each architecture.
          sha256sum -- *.tar.gz *.cdx.json images.json > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Draft for maintainer review. Both Linux architectures contain statically
          linked core, gateway and bridge binaries, LICENSE and build metadata.
          SHA256SUMS covers archives and CycloneDX source/binary inventories.
          Source inventories include locked Rust build/dev dependencies; they are
          a dependency superset, not a claim that every package is runtime-linked.
          Verify artifacts and release notes before manually publishing.
          NOTES
          cat image-release-notes.md >> release-notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file release-notes.md \
            ./*.tar.gz ./*.cdx.json images.json SHA256SUMS
