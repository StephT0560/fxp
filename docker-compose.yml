# SPDX-License-Identifier: MIT
# Core, gateway and FIX bridge. Secrets come from the environment (or a .env
# file next to this one); compose refuses to start without them:
#   export FXP_JWT_SECRET=... FXP_FIX_CREDENTIALS='FIRM01:password,...'
#   docker compose up --build
#
# The core listens on 127.0.0.1:8080 and the gateway/bridge dial 127.0.0.1, so
# all three share the core container's network namespace. Only the client-facing
# ports are published; the core port stays private.

x-image: &image
  image: fxp:local
  restart: unless-stopped

services:
  core:
    <<: *image
    build: .
    command: ["fxp_core"]
    init: true
    stop_grace_period: 15s
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - FXP_SYMBOL_CONFIG
      - FXP_SESSION_SCHEDULE
      - FXP_EVENT_LOG
      - FXP_CORE_AUTH_TOKEN
      - FXP_STP_DEFAULT
      - FXP_SYMBOLS
      - FXP_MAX_SYMBOLS
      - FXP_SHUTDOWN_TIMEOUT_SEC=${FXP_SHUTDOWN_TIMEOUT_SEC:-5}
    volumes:
      - core_store:/data/core_store
      - ./config:/etc/fxp:ro
    ports:
      - "${FXP_WS_PORT:-8081}:8081"   # gateway WebSocket
      - "${FXP_TCP_PORT:-8082}:8082"  # gateway TCP (FXP protobuf)
      - "${FXP_FIX_PORT:-8083}:8083"  # FIX 4.4 bridge
    healthcheck:
      test: ["CMD", "/usr/local/bin/core_healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15

  gateway:
    <<: *image
    command: ["go_gateway"]
    init: true
    stop_grace_period: 15s
    network_mode: "service:core"
    depends_on:
      core:
        condition: service_healthy
    environment:
      FXP_TLS_CERT_FILE: ${FXP_TLS_CERT_FILE:-}
      FXP_TLS_KEY_FILE: ${FXP_TLS_KEY_FILE:-}
      FXP_TLS_CLIENT_CA_FILE: ${FXP_TLS_CLIENT_CA_FILE:-}
      FXP_TLS_REQUIRED: ${FXP_TLS_REQUIRED:-false}
      FXP_JWT_SECRET: ${FXP_JWT_SECRET:?set FXP_JWT_SECRET}
      FXP_JWT_KID: ${FXP_JWT_KID:-}
      FXP_CORE_AUTH_TOKEN: ${FXP_CORE_AUTH_TOKEN:-}
      FXP_GW_TCP_ADDR: ${FXP_GW_TCP_ADDR:-:8082}
      FXP_GW_WS_ADDR: ${FXP_GW_WS_ADDR:-:8081}
      FXP_JWT_PREVIOUS_KID: ${FXP_JWT_PREVIOUS_KID:-}
      FXP_JWT_PREVIOUS_SECRET: ${FXP_JWT_PREVIOUS_SECRET:-}
      FXP_JWT_ISSUER: ${FXP_JWT_ISSUER:-}
      FXP_JWT_AUDIENCE: ${FXP_JWT_AUDIENCE:-}
      FXP_JWT_LEEWAY_SEC: ${FXP_JWT_LEEWAY_SEC:-}
      FXP_JWT_REPLAY_CACHE: ${FXP_JWT_REPLAY_CACHE:-}
      FXP_GW_WS_ALLOWED_ORIGINS: ${FXP_GW_WS_ALLOWED_ORIGINS:-}
      FXP_GW_CLIENT_QUEUE: ${FXP_GW_CLIENT_QUEUE:-8192}
      FXP_GW_MD_QUEUE: ${FXP_GW_MD_QUEUE:-4096}
      FXP_LOG_LEVEL: ${FXP_LOG_LEVEL:-info}
      FXP_SHUTDOWN_TIMEOUT_SEC: ${FXP_SHUTDOWN_TIMEOUT_SEC:-5}

    volumes:
      - ./certs:/etc/fxp/certs:ro

  bridge:
    <<: *image
    command: ["fix_bridge"]
    init: true
    stop_grace_period: 15s
    network_mode: "service:core"
    depends_on:
      gateway:
        condition: service_started
    environment:
      FXP_TLS_CERT_FILE: ${FXP_TLS_CERT_FILE:-}
      FXP_TLS_KEY_FILE: ${FXP_TLS_KEY_FILE:-}
      FXP_TLS_CLIENT_CA_FILE: ${FXP_TLS_CLIENT_CA_FILE:-}
      FXP_TLS_REQUIRED: ${FXP_TLS_REQUIRED:-false}
      FXP_JWT_SECRET: ${FXP_JWT_SECRET:?set FXP_JWT_SECRET}
      FXP_GATEWAY_TLS: ${FXP_GATEWAY_TLS:-false}
      FXP_GATEWAY_TLS_CA_FILE: ${FXP_GATEWAY_TLS_CA_FILE:-}
      FXP_GATEWAY_TLS_CERT_FILE: ${FXP_GATEWAY_TLS_CERT_FILE:-}
      FXP_GATEWAY_TLS_KEY_FILE: ${FXP_GATEWAY_TLS_KEY_FILE:-}
      FXP_GATEWAY_TLS_SERVER_NAME: ${FXP_GATEWAY_TLS_SERVER_NAME:-}
      FXP_JWT_KID: ${FXP_JWT_KID:-}
      FXP_JWT_ISSUER: ${FXP_JWT_ISSUER:-}
      FXP_JWT_AUDIENCE: ${FXP_JWT_AUDIENCE:-}
      FXP_SYMBOL_CONFIG: ${FXP_SYMBOL_CONFIG:-}
      FXP_FIX_CREDENTIALS: ${FXP_FIX_CREDENTIALS:?set FXP_FIX_CREDENTIALS}
      FXP_FIX_STORE_DIR: /data/fix_store
      FXP_FIX_STORE_FSYNC: ${FXP_FIX_STORE_FSYNC:-strict}
      FXP_FIX_DICTIONARY_STRICT: ${FXP_FIX_DICTIONARY_STRICT:-false}
      FXP_FIX_START_TIME: ${FXP_FIX_START_TIME:-}
      FXP_FIX_END_TIME: ${FXP_FIX_END_TIME:-}
      FXP_FIX_START_DAY: ${FXP_FIX_START_DAY:-}
      FXP_FIX_END_DAY: ${FXP_FIX_END_DAY:-}
      FXP_FIX_TIME_ZONE: ${FXP_FIX_TIME_ZONE:-UTC}
      FXP_FIX_RESET_ON_LOGON: ${FXP_FIX_RESET_ON_LOGON:-false}
      FXP_FIX_RESET_ON_LOGOUT: ${FXP_FIX_RESET_ON_LOGOUT:-false}
      FXP_FIX_RESET_ON_DISCONNECT: ${FXP_FIX_RESET_ON_DISCONNECT:-false}
      FXP_LOG_LEVEL: ${FXP_LOG_LEVEL:-info}
      FXP_SHUTDOWN_TIMEOUT_SEC: ${FXP_SHUTDOWN_TIMEOUT_SEC:-5}
    volumes:
      - fix_store:/data/fix_store
      - ./config:/etc/fxp:ro
      - ./certs:/etc/fxp/certs:ro

volumes:
  core_store:
  fix_store:
